<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 108 500 206" role="img" aria-label="Finger Lakes Randonneurs logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Finger Lakes Randonneurs</title>
  <defs>
    <!-- Knockout mask for the bar bag: anything drawn black here is cut out
         of the bag, so the background shows through. That gives us a "gap"
         around the handlebar and the bag's seams without a second ink color. -->
    <mask id="bag-knockout" maskUnits="userSpaceOnUse" x="250" y="110" width="80" height="60">
      <rect x="250" y="110" width="80" height="60" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <!-- handlebar halo: same path as the bar, ~2.5 units wider on each side -->
        <path d="M326.8 125.5 L303.5 125.5 C297 125.5 293.5 130.5 293.5 137 C293.5 144 299 147.6 311 149.5" stroke-width="10.5"/>
        <!-- flap seam -->
        <path d="M268 143 L312 143" stroke-width="1.8"/>
      </g>
    </mask>
  </defs>
  <rect fill="#8a9c7a" x="20" y="162" width="480" height="100"/>
  <polygon fill="#efe5c9" points="268,162 20,162 20,262 92,262"/>
  <rect fill="#2c261f" x="20" y="262" width="480" height="12"/>
  <g fill="none" stroke="#2c261f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="288" cy="213" r="46"/>
    <circle cx="444" cy="213" r="46"/>
    <path d="M274.4 165.4 A49.5 49.5 0 0 1 334.5 229.9 M395.0 219.9 A49.5 49.5 0 1 1 491.8 225.8" stroke-width="5" stroke-linecap="butt"/>
    <path d="M288 213 L337 213 M444 213 L489.0 194" stroke-width="2.5"/>
    <path d="M323 139 L317 160 M323 140 L406.6 140 M380 222 L406.6 140 M317 160 L380 222 M380 222 L444 213 M406.6 140 L444 213"/>
    <path d="M317 160 L310.1 184 C306.8 195.5 297 210 288 213"/>
    <path d="M406.6 140 L412.4 122"/>
    <path d="M274 162 L314 162"/>
    <circle cx="380" cy="222" r="11" stroke-width="5"/>
    <path d="M380 222 L360 228" stroke-width="4"/>
  </g>
  <g fill="#2c261f">
    <path d="M392.5 120.4C392.5 118.6 394.5 117.6 399 117.5L431.5 117.3C433.3 117.3 434.2 118.2 434.2 119.8L434.4 127C434.4 128.6 433.3 129.4 431.5 129.4L417 129.2C410 129 404 126.5 399 124C397 123 394.5 122.6 393.6 122.2C392.8 121.8 392.5 121.2 392.5 120.4Z"/>
    <rect x="354" y="227" width="12" height="3.5" rx="1"/>
    <rect x="264" y="159" width="11" height="8" rx="2"/>
  </g>
  <!-- bar bag: body + slightly overhanging flap, cut by the knockout mask -->
  <g fill="#2c261f" mask="url(#bag-knockout)">
    <rect x="270" y="133" width="41" height="26.5" rx="3"/>
    <rect x="268.5" y="131.5" width="44" height="11.5" rx="3.5"/>
  </g>
  <!-- decaleur bracket, bag to stem -->
  <path d="M312.5 136 L322 136" fill="none" stroke="#2c261f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- stem + drop handlebar, drawn over the bag -->
  <path d="M323 139 L326.8 125.5 L303.5 125.5 C297 125.5 293.5 130.5 293.5 137 C293.5 144 299 147.6 311 149.5" fill="none" stroke="#2c261f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
